# Railway deployment for FastAPI backend
# In Railway: set "Root Directory" to "backend", then deploy.
# Or run from repo root with: railway link && railway up (after setting root to backend in dashboard)

[build]
builder = "dockerfile"

[deploy]
startCommand = "python start.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
